[package]
name = "ic-engine"
description = "Repository ingestion engine: parsing, chunking, and embedding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `cdylib` for the Python extension module, `rlib` so the CLI and the benches
# can link the same code rather than duplicating it.
name = "ic_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ic-engine"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
ignore = "0.4"
# Deliberately without the `extension-module` feature. That feature stops the
# crate linking libpython, which is right for a wheel and fatal for
# `cargo test --all-features`. maturin adds it at build time instead.
pyo3 = { version = "0.29", optional = true }
sha2 = "0.10"
thiserror = "2"
# 0.25 matches the grammar crates; 0.26 is ahead of them.
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
# Tokeniser only — no hub download. `onig` is required for the WordPiece model.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[features]
python = ["dep:pyo3"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "ingest"
harness = false

[lints]
workspace = true
