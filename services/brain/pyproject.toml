[project]
name = "brain"
version = "0.1.0"
description = "InfraCanvas analysis and generation service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "psycopg[binary,pool]>=3.2",
  "pydantic-ai-slim[anthropic,bedrock,google,openai]>=2.31.0",
  "cryptography>=50.0.0",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "datamodel-code-generator>=0.28",
  "httpx>=0.27",
  "inline-snapshot>=0.35.4",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
brain-mcp = "brain.mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF", "ASYNC", "S"]
per-file-ignores = { "tests/*" = [
  # S101 is pytest's entire vocabulary; asserts in tests are the point.
  "S101",
], "src/brain/ir/models.py" = [
  # Generated from the IR schema. Style findings here are arguments with
  # datamodel-code-generator, and the file is rewritten by the next run anyway.
  "E501",
  "N815",
  "RUF012",
] }

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
# anyio arrives transitively and its pytest plugin claims async fixtures too, so
# with pytest-asyncio also installed the runner an async fixture gets depends on
# plugin registration order. pytest-asyncio is this suite's runner; the other one
# is switched off rather than left to chance.
addopts = "-q --strict-markers -p no:anyio"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: needs a live Postgres. Excluded from the unit test gate.",
]
