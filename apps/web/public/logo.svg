<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Canvas/artboard frame -->
  <rect x="4" y="4" width="56" height="56" rx="8" stroke="url(#gradient)" stroke-width="3" fill="none"/>

  <!-- Inner canvas area -->
  <rect x="10" y="10" width="44" height="44" rx="4" fill="url(#gradient)" opacity="0.1"/>

  <!-- Infrastructure nodes (representing cloud services) -->
  <!-- Top node -->
  <circle cx="32" cy="18" r="6" fill="url(#gradient)"/>

  <!-- Bottom left node -->
  <circle cx="20" cy="40" r="5" fill="url(#gradient)"/>

  <!-- Bottom right node -->
  <circle cx="44" cy="40" r="5" fill="url(#gradient)"/>

  <!-- Center node (larger, representing main service) -->
  <circle cx="32" cy="32" r="7" fill="url(#gradient)"/>

  <!-- Connection lines -->
  <path d="M32 24 L32 25" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M27 30 L24 36" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M37 30 L40 36" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M25 40 L39 40" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"/>

  <!-- Inner icons on nodes (small details) -->
  <rect x="29" y="15" width="6" height="6" rx="1" fill="white" opacity="0.9"/>
  <rect x="29" y="29" width="6" height="6" rx="1" fill="white" opacity="0.9"/>
  <circle cx="20" cy="40" r="2" fill="white" opacity="0.9"/>
  <circle cx="44" cy="40" r="2" fill="white" opacity="0.9"/>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
</svg>
