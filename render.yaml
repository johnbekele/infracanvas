# Render Blueprint for InfraCanvas API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: infracanvas-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: corepack enable && pnpm install --prod=false && pnpm turbo build --filter=@infracanvas/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: APP_URL
        sync: false # Set this to your Vercel frontend URL
      - key: API_URL
        sync: false # Set this to your Render backend URL
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Migrations are not run automatically. Render only offers a pre-deploy
      # hook on paid instance types, so apply them from a machine with the
      # database URL before promoting a release that adds one:
      #   DATABASE_URL=<render connection string> pnpm db:migrate
      - key: DATABASE_URL
        fromDatabase:
          name: infracanvas-db
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

databases:
  - name: infracanvas-db
    plan: free
    region: oregon
    postgresMajorVersion: '17'
