# --- Special handling ---------------------------------------------------------
- name: 'db:destructive-approved'
  color: 'B60205'
  description: Explicitly approves destructive DDL through Gate 4.
- name: 'needs:security-review'
  color: 'B60205'
  description: Requires the security-review pass before merge.
- name: perf-regression
  color: 'D93F0B'
  description: Opened automatically when a benchmark regresses beyond budget.
- name: nightly-failure
  color: 'D93F0B'
  description: Opened automatically by the nightly pipeline.
- name: bug
  color: 'D73A4A'
  description: Behaviour differs from specification.
- name: good-first-issue
  color: '7057FF'
  description: Well-scoped entry point for new contributors.
