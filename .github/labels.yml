# Canonical label taxonomy. Applied by `scripts/gh/seed-labels.sh`, which is
# idempotent and safe to re-run. Labels not listed here are left untouched.

# --- Workflow state -----------------------------------------------------------
- name: agent-ready
  color: '0E8A16'
  description: Spec is complete and verified by Gate 0. An agent may start this.
- name: needs-spec
  color: 'D93F0B'
  description: Missing or incomplete required sections. Not startable.
- name: status:blocked
  color: 'B60205'
  description: Waiting on a dependency issue to land.
- name: status:in-progress
  color: 'FBCA04'
  description: Actively being worked on.
- name: do-not-merge
  color: '000000'
  description: Hard block on the merge queue.

# --- Risk tier ----------------------------------------------------------------
- name: 'tier:1'
  color: 'B60205'
  description: Auth, IAM, deploy, credentials, or codegen. Security review required.
- name: 'tier:2'
  color: 'FBCA04'
  description: Normal application code. Human approval required.
- name: 'tier:3'
  color: 'C2E0C6'
  description: Docs or tests only. Eligible for the fast lane.

# --- Size ---------------------------------------------------------------------
- name: 'size:s'
  color: 'C2E0C6'
  description: Under 200 lines of diff.
- name: 'size:m'
  color: 'FEF2C0'
  description: 200 to 600 lines of diff.
- name: 'size:l'
  color: 'F9D0C4'
  description: Over 600 lines. Must justify why it cannot be split.

