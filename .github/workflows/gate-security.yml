name: Gate 5 - Security and Supply Chain

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: gate-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      # Lob is excluded because its detector matches `test_` followed by 32 word
      # characters, which is every Python test with a descriptive name, and its
      # verification endpoint reports those as verified rather than rejecting
      # them. Nothing here talks to Lob, so the detector can only produce false
      # positives, and a gate that cries wolf on a test name teaches people to
      # ignore it. Gitleaks and GitGuardian still scan the same diff.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@3ab759fef4bb5935d4fe9ac68b503d05346b8364 # main
        with:
          extra_args: --results=verified,unknown --exclude-detectors=Lob

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high
      - name: pip-audit
        run: |
          if [ -f services/brain/pyproject.toml ]; then
            pipx install pip-audit
            pip-audit --strict -r <(cd services/brain && uv export --format requirements-txt)
          else
            echo "::notice::No Python project yet."
          fi
      # Installs the toolchain this repository pins before anything invokes
      # cargo. Left to itself, `cargo install` makes rustup fetch that toolchain
      # implicitly, and the clippy component it carries collides with the
      # cargo-clippy already on the runner image, which fails the job for a
      # reason that has nothing to do with the dependencies being audited.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: cargo audit
        run: |
          if [ -f Cargo.toml ]; then
            cargo install cargo-audit --locked
            # --deny warnings promotes unmaintained/yanked advisories to failures,
            # not just vulnerabilities. RUSTSEC-2024-0436 is one such warning: the
            # `paste` crate is archived, not vulnerable, and reaches us only as a
            # transitive dependency of tree-sitter, which we cannot drop. Ignore
            # this single advisory by id so a genuine vulnerability still fails the
            # gate; revisit if a maintained replacement propagates upstream.
            cargo audit --deny warnings --ignore RUSTSEC-2024-0436
          else
            echo "::notice::No Cargo workspace yet."
          fi

  licenses:
    name: License allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: Reject copyleft in an MIT project
        run: |
          pnpm dlx license-checker-rseidelsohn \
            --production \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0;MPL-2.0" \
            --excludePrivatePackages

  iac-policy:
    name: Generated IaC policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkov on generated fixtures
        run: |
          # We scan our own output. If the generator emits an insecure default,
          # every user of InfraCanvas inherits it, so this is a release blocker.
          if [ -d tests/fixtures/generated ]; then
            pipx install checkov
            checkov --directory tests/fixtures/generated --framework terraform --compact --quiet
          else
            echo "::notice::No generated fixtures yet; policy scan is inert."
          fi

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          artifact-name: infracanvas-sbom.cdx.json

  no-egress:
    name: Egress allowlist and no telemetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Outbound host allowlist
        run: node scripts/ci/check-egress-allowlist.mjs
      - name: No analytics or telemetry in the lockfile
        run: node scripts/ci/check-no-telemetry.mjs
