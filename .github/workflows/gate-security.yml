name: Gate 5 - Security and Supply Chain

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: gate-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high
      - name: pip-audit
        run: |
          if [ -f services/brain/pyproject.toml ]; then
            pipx install pip-audit
            pip-audit --strict -r <(cd services/brain && uv export --format requirements-txt)
          else
            echo "::notice::No Python project yet."
          fi
      - name: cargo audit
        run: |
          if [ -f Cargo.toml ]; then
            cargo install cargo-audit --locked
            cargo audit --deny warnings
          else
            echo "::notice::No Cargo workspace yet."
          fi

  licenses:
    name: License allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Reject copyleft in an MIT project
        run: |
          pnpm dlx license-checker-rseidelsohn \
            --production \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0;MPL-2.0" \
            --excludePrivatePackages

  iac-policy:
    name: Generated IaC policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov on generated fixtures
        run: |
          # We scan our own output. If the generator emits an insecure default,
          # every user of InfraCanvas inherits it, so this is a release blocker.
          if [ -d tests/fixtures/generated ]; then
            pipx install checkov
            checkov --directory tests/fixtures/generated --framework terraform --compact --quiet
          else
            echo "::notice::No generated fixtures yet; policy scan is inert."
          fi

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: infracanvas-sbom.cdx.json
