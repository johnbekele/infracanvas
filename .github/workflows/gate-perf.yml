name: Gate 6 - Performance

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: gate-perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Jobs always run and guard internally, so a ruleset can require them without
# a skipped conclusion blocking the merge queue.

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      brain: ${{ steps.filter.outputs.brain }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref }}
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            brain:
              - 'services/brain/**'
            web:
              - 'apps/web/**'

  ingest-performance:
    name: Ingest throughput and memory ceiling
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide whether to run
        id: guard
        run: |
          # Guarded on the benchmark fixture, not on Cargo.toml. The crate exists
          # long before it can index anything, and both steps below consume this
          # repository: the benchmark measures throughput over it and the RSS
          # assertion indexes it.
          if [ "${{ needs.changes.outputs.rust }}" = "true" ] && [ -d tests/fixtures/repos/large ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No benchmark fixture yet, or no engine changes; performance gate is inert."
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.guard.outputs.run == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.guard.outputs.run == 'true'
      - name: Benchmark against the stored baseline
        if: steps.guard.outputs.run == 'true'
        run: cargo bench --workspace -- --baseline main --noplot
      - name: Assert the peak RSS ceiling
        if: steps.guard.outputs.run == 'true'
        run: |
          # The budget is a product requirement: the engine must index a large
          # repository on an ordinary laptop that is also running an IDE.
          /usr/bin/time -v cargo run --release --bin ic-engine -- \
            index tests/fixtures/repos/large 2> rss.txt
          peak=$(grep 'Maximum resident set size' rss.txt | grep -oE '[0-9]+')
          echo "Peak RSS: ${peak} KB"
          if [ "${peak:-0}" -gt 307200 ]; then
            echo "::error::Peak RSS ${peak} KB exceeds the 300 MB budget."
            exit 1
          fi

  retrieval-latency:
    name: Retrieval latency
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: infracanvas
          POSTGRES_PASSWORD: infracanvas
          POSTGRES_DB: infracanvas_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infracanvas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide whether to run
        id: guard
        run: |
          # Guarded on the benchmark suite, not on the Python project. The
          # project exists several epics before the retrieval benchmarks do.
          if [ "${{ needs.changes.outputs.brain }}" = "true" ] && [ -d services/brain/tests/bench ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No retrieval benchmarks yet, or no brain changes; latency gate is inert."
          fi
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        if: steps.guard.outputs.run == 'true'
        with:
          enable-cache: true
      - name: Measure p95 retrieval latency
        if: steps.guard.outputs.run == 'true'
        env:
          DATABASE_URL: postgres://infracanvas:infracanvas@localhost:5432/infracanvas_bench?sslmode=disable
        run: |
          uv sync --directory services/brain --all-extras
          uv run --directory services/brain pytest tests/bench --benchmark-only --benchmark-json=bench.json
          uv run --directory services/brain python -m brain.eval.assert_budget bench.json --p95-ms 250

  bundle-size:
    name: Web bundle size
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide whether to run
        id: guard
        run: |
          if [ "${{ needs.changes.outputs.web }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No web changes; bundle size gate is inert."
          fi
      - uses: ./.github/actions/setup-node
        if: steps.guard.outputs.run == 'true'
      - if: steps.guard.outputs.run == 'true'
        run: pnpm turbo build --filter=@infracanvas/web
      # A ratchet: set just above the current initial payload so it blocks growth
      # rather than describing an aspiration. The designer, which is most of the
      # weight, now loads on demand, which brought this from 260 KB to 215 KB.
      - name: Assert the gzip budget for initial JavaScript
        if: steps.guard.outputs.run == 'true'
        run: node scripts/ci/check-bundle-size.mjs apps/web/dist 215
