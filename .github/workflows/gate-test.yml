name: Gate 3 - Test

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: gate-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: pnpm turbo build

  test-node:
    name: Unit tests (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      # The IR generator emits TypeScript and Pydantic from one schema, and its
      # idempotency test runs the whole generator rather than half of it, so this
      # job needs the Python toolchain even though it runs no Python tests.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --directory services/brain --all-extras
      - run: pnpm turbo build --filter=@infracanvas/core
      - run: pnpm turbo test
      - name: Collect coverage reports
        if: always()
        run: |
          mkdir -p coverage-artifacts/node
          find apps -path '*/coverage/cobertura-coverage.xml' -print -exec sh -c '
            for report do
              package_dir=${report%/coverage/cobertura-coverage.xml}
              artifact_dir="coverage-artifacts/node/${package_dir#apps/}"
              mkdir -p "$artifact_dir"
              artifact="$artifact_dir/coverage.xml"
              sed "s#filename=\"src/#filename=\"$package_dir/src/#g" "$report" > "$artifact"
            done
          ' sh {} +
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-node
          path: '**/coverage.xml'
          if-no-files-found: warn
          retention-days: 7

  test-python:
    name: Unit tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: exists
        run: |
          if [ -f services/brain/pyproject.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::services/brain not present yet; Python tests are inert."
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.exists.outputs.found == 'true'
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.exists.outputs.found == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.exists.outputs.found == 'true'
      - if: steps.exists.outputs.found == 'true'
        run: uv sync --directory services/brain --all-extras
      - if: steps.exists.outputs.found == 'true'
        run: uv tool run maturin build -m crates/ic-engine/Cargo.toml --release
      - if: steps.exists.outputs.found == 'true'
        run: uv pip install --directory services/brain "$PWD"/target/wheels/ic_engine-*.whl
      - if: steps.exists.outputs.found == 'true'
        run: cargo build --bin ic-engine --release
      - if: steps.exists.outputs.found == 'true'
        run: echo "$PWD/target/release" >> "$GITHUB_PATH"
      - if: steps.exists.outputs.found == 'true'
        run: uv run --directory services/brain pytest -m "not integration" --cov=src --cov-report=xml
      - name: Normalize Python coverage paths
        if: always()
        run: |
          if [ -f services/brain/coverage.xml ]; then
            sed -i 's#filename="src/#filename="services/brain/src/#g' services/brain/coverage.xml
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-python
          path: '**/coverage.xml'
          if-no-files-found: warn
          retention-days: 7

  test-rust:
    name: Unit tests (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: exists
        run: |
          if [ -f Cargo.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cargo workspace not present yet; Rust tests are inert."
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.exists.outputs.found == 'true'
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.exists.outputs.found == 'true'
      # Local embedder weights: fetch once per runner, reuse across runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.exists.outputs.found == 'true'
        with:
          path: ~/.cache/infracanvas/models
          key: infracanvas-embed-bge-small-en-v1.5-q-${{ runner.os }}
          restore-keys: |
            infracanvas-embed-bge-small-en-v1.5-q-
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        if: steps.exists.outputs.found == 'true'
        with:
          tool: cargo-llvm-cov
      - if: steps.exists.outputs.found == 'true'
        run: cargo llvm-cov --workspace --all-features --cobertura --output-path coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-rust
          path: '**/coverage.xml'
          if-no-files-found: warn
          retention-days: 7

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match the image in docker-compose.yml so local and CI agree.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: infracanvas
          POSTGRES_PASSWORD: infracanvas
          POSTGRES_DB: infracanvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infracanvas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://infracanvas:infracanvas@localhost:5432/infracanvas_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: Apply migrations
        run: |
          if [ -d db/migrations ]; then
            curl -fsSL -o /usr/local/bin/dbmate \
              https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
            chmod +x /usr/local/bin/dbmate
            dbmate --migrations-dir db/migrations up
          else
            echo "::notice::db/migrations not present yet; skipping."
          fi
      - name: Run integration suites
        run: |
          if [ -d db/migrations ]; then
            pnpm turbo test:integration
          else
            echo "::notice::No integration suites to run yet."
          fi

  coverage:
    name: Diff coverage
    needs: [test-node, test-python, test-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: false
      - name: Report diff coverage
        run: |
          set -euo pipefail
          mapfile -t reports < <(find coverage-reports -name '*.xml' -print 2>/dev/null || true)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::No coverage reports were uploaded; the test jobs stopped producing them."
            echo "No coverage reports were uploaded; the test jobs stopped producing them." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          node scripts/ci/rebase-coverage.mjs "${reports[@]}"
          pipx install diff-cover
          diff-cover "${reports[@]}" \
            --compare-branch="origin/${{ github.base_ref || 'main' }}" \
            --fail-under=0 \
            --markdown-report coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
