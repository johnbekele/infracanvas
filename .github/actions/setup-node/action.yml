name: Setup Node
description: Install pnpm and Node with a warm dependency cache. Used by every Node-based gate.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 8.15.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'
        cache: 'pnpm'
    - shell: bash
      run: pnpm install --frozen-lockfile
