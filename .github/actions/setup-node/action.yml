name: Setup Node
description: Install pnpm and Node with a warm dependency cache. Used by every Node-based gate.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 8.15.0
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
    - shell: bash
      run: pnpm install --frozen-lockfile
